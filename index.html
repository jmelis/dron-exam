<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piloto A1/A3">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Piloto A1/A3 · Quiz AESA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --line:#DDE3EB; --line2:#EEF1F5; --ink:#0E1726; --ink2:#4A5568; --mute:#5B6475;
  --blue:#1D4ED8; --blue2:#3B82F6; --bluet:#E3ECFD; --blued:#1E3A8A;
  --ok:#0F7B5F; --okt:#E7F5EF; --okd:#0B4F3D;
  --ko:#C2410C; --kot:#FDEDE4; --kod:#7C2D12;
  --am:#B45309; --amt:#FEF3C7; --amd:#92400E; --tipbg:#FEF7E6; --tipink:#4A3200;
  --dark:#0E1726; --dark2:#1F2A3D; --darkline:#4B5B74; --darkmute:#A9B7CC; --darkink2:#D5DEEA;
  --track:#E6EBF2; --chip:#EEF1F5;
  --head:"Space Grotesk", Inter, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1220; --card:#121B2C; --line:#26324A; --line2:#1C273B; --ink:#E8EDF5; --ink2:#B6C2D4; --mute:#94A1B8;
    --blue:#4F8EF7; --blue2:#3B82F6; --bluet:#16284A; --blued:#C7D9FB;
    --ok:#34B98E; --okt:#0F2E25; --okd:#A7F0D2;
    --ko:#F07A45; --kot:#3A1C10; --kod:#FFD2BC;
    --am:#F0A64A; --amt:#3A2A0E; --amd:#FCD9A0; --tipbg:#2E2410; --tipink:#F8E3B5;
    --dark:#18243A; --dark2:#22314B; --darkline:#3D4D69;
    --track:#25324A; --chip:#1E2A40;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-0.01em}
p{margin:0}
#app{max-width:1240px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
@media (min-width:700px){#app{padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right))}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:16px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.btn.big{min-height:58px;font-size:18px;border-radius:14px;width:100%}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.back{min-height:44px;padding:0 14px;font-size:15px;white-space:nowrap;flex-shrink:0}
.icon{width:18px;height:18px;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink)}
button.chip{min-height:44px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--track);color:var(--ink2)}
.tag.blue{background:var(--bluet);color:var(--blued)}
.nov{display:inline-block;font-size:11px;font-weight:700;color:var(--amd);background:var(--amt);padding:2px 6px;border-radius:6px;letter-spacing:.02em;vertical-align:middle}

/* cabecera inicio */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;border-radius:12px;background:#0E1726;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand h1{font-size:26px;font-weight:700}
.brand p{font-size:14px;color:var(--ink2);margin-top:2px}

.home{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.home{grid-template-columns:460px minmax(0,1fr)}}

.next{background:var(--dark);color:#fff;border:none;display:flex;flex-direction:column;gap:14px;padding:22px}
.next .label{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--darkmute)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:var(--dark2)}
.seg button{min-height:42px;border-radius:9px;border:none;background:transparent;color:var(--darkink2);font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:#0E1726;font-weight:700}
.lens{display:flex;gap:6px;margin-left:auto}
.lens button{width:52px;min-height:42px;border-radius:9px;border:1px solid var(--darkline);background:transparent;color:var(--darkink2);font-size:15px;font-weight:600}
.lens button[aria-pressed="true"]{background:#fff;border-color:#fff;color:#0E1726;font-weight:700}
.next .go{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:14px;border:none;background:var(--blue2);color:#fff;font-size:18px;font-weight:700}
.next .foot{font-size:13px;line-height:1.45;color:var(--darkmute)}

.scorebar{position:relative;height:12px;border-radius:6px;background:var(--track);margin:4px 0}
.scorebar i{position:absolute;left:0;top:0;height:12px;border-radius:6px;background:var(--blue)}
.scorebar b{position:absolute;top:-5px;width:2px;height:22px;background:var(--ink)}
.scorebar b.t{background:var(--ok)}
.big{font-family:var(--head);font-weight:700}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;color:var(--ink);min-height:64px}
.mode b{font-size:16px}
.mode span{font-size:13px;color:var(--ink2)}

.topics h2{font-size:20px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;align-items:center;gap:12px;min-height:44px;padding:4px 6px;border:none;border-top:1px solid var(--line2);background:transparent;text-align:left;width:100%}
.trow .n{font-size:14px;font-weight:600;line-height:1.3}
.trow .n small{font-weight:400;color:var(--mute);font-size:13px}
.trow .pct{font-size:14px;font-weight:600;text-align:right}
@media (max-width:520px){.trow{grid-template-columns:minmax(0,1fr) 60px 40px}}
.track{display:block;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.track i{display:block;height:8px;border-radius:4px}
.lv-hi{background:var(--ok)} .lv-mid{background:var(--blue)} .lv-lo{background:var(--ko)}

.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--amt);color:var(--amd);font-size:14px;line-height:1.45;margin-bottom:14px}
.banner .grow{min-width:220px}
.banner .btn{min-height:40px;font-size:14px}
.banner.blue{background:var(--bluet);color:var(--blued)}
.banner.red{background:var(--kot);color:var(--kod)}

footer.foot{margin-top:24px;font-size:12px;color:var(--mute);text-align:center;line-height:1.6}

/* pantalla de pregunta */
.qtop{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.prog{flex:1 1 auto;display:flex;flex-direction:column;gap:6px;min-width:0}
.prog .t{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.prog .t strong{color:var(--ink)}
.pbar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.pbar i{display:block;height:8px;background:var(--blue);border-radius:4px}
.qgrid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.qgrid{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px}}
.qtext{font-family:var(--head);font-size:24px;line-height:1.3;font-weight:600}
@media (min-width:900px){.qtext{font-size:28px}}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);text-align:left;font-size:17px;line-height:1.35;color:var(--ink);width:100%}
.opt .k{flex-shrink:0;width:32px;height:32px;border-radius:9px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--ink2)}
.opt .lbl{margin-left:auto;font-size:13px;font-weight:700;padding-left:8px;white-space:nowrap}
.opt.right{background:var(--okt);border-color:var(--ok);color:var(--okd);font-weight:600}
.opt.right .k{background:var(--ok);color:#fff}
.opt.right .lbl{color:var(--ok)}
.opt.wrong{background:var(--kot);border-color:var(--ko);color:var(--kod);font-weight:600}
.opt.wrong .k{background:var(--ko);color:#fff}
.opt.wrong .lbl{color:var(--ko)}
.opt.dim{color:var(--mute)}
.opt.sel{background:var(--bluet);border-color:var(--blue);color:var(--blued);font-weight:600}
.opt.sel .k{background:var(--blue);color:#fff}
.tf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tf .opt{justify-content:center;min-height:72px;font-size:19px;font-weight:600}

.conf{background:var(--dark);color:#fff;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.conf .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.conf .h b{font-size:18px}
.conf .h span{font-size:13px;color:var(--darkmute)}
.conf .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.conf .two button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;border-radius:12px;border:1px solid var(--darkline);background:transparent;color:#fff;padding:6px 10px}
.conf .two button:first-child{background:var(--blue2);border-color:var(--blue2)}
.conf .two button b{font-size:17px}
.conf .two button span{font-size:13px;color:#DCE7FD;text-align:center}
.conf .two button:last-child span{color:var(--darkmute)}
.conf p{font-size:14px;line-height:1.5;color:var(--darkink2)}
.conf p strong{color:#fff}
.conf a{color:#93B4F8;font-weight:600}

.expl{display:flex;flex-direction:column;gap:14px}
.expl h4{margin:0 0 4px;font-size:15px;font-weight:700}
.expl .no h4{color:var(--ko)} .expl .si h4{color:var(--ok)}
.expl p{font-size:17px;line-height:1.5}
.tip{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--tipbg);color:var(--tipink);font-size:16px;line-height:1.5}
.src{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2);flex-wrap:wrap}
.src a{font-weight:600}
.cont{display:flex;align-items:center;gap:16px;padding-top:14px;border-top:1px solid var(--line2);flex-wrap:wrap}
.cont p{flex:1 1 220px;font-size:14px;line-height:1.45;color:var(--ink2)}
.okbox{background:var(--okt);border:1px solid var(--ok);color:var(--okd);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.5}

/* ordenar / emparejar */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 14px;border-radius:12px;border:2px dashed var(--line);font-size:16px;color:var(--mute);background:transparent;text-align:left;width:100%}
.slot.full{border-style:solid;border-color:var(--blue);background:var(--bluet);color:var(--blued);font-weight:600}
.slot.right{border-style:solid;border-color:var(--ok);background:var(--okt);color:var(--okd);font-weight:600}
.slot.wrong{border-style:solid;border-color:var(--ko);background:var(--kot);color:var(--kod);font-weight:600}
.slot .k{flex-shrink:0;width:28px;height:28px;border-radius:7px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink2)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.pool button{min-height:48px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;text-align:left;line-height:1.3}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch}
.mrow .left{display:flex;align-items:center;padding:8px 14px;border-radius:12px;background:var(--chip);font-size:15px;font-weight:600;min-height:52px;line-height:1.3}
.mrow .slot{min-height:52px;font-size:15px;line-height:1.3}

/* fin de ronda */
.endgrid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.endgrid{grid-template-columns:540px minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:12px;background:var(--bg)}
.stat b{font-family:var(--head);font-size:24px}
.stat span{font-size:14px;color:var(--ink2)}
.stat.g{background:var(--okt)} .stat.g b,.stat.g span{color:var(--okd)}
.stat.b{background:var(--bluet)} .stat.b b,.stat.b span{color:var(--blued)}
.stat.r{background:var(--kot)} .stat.r b,.stat.r span{color:var(--kod)}
.moved{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:15px}
.again{display:flex;align-items:center;justify-content:space-between;min-height:72px;padding:0 24px;border-radius:16px;background:var(--blue);color:#fff;border:none;width:100%;text-align:left}
.again b{font-size:19px;display:block}
.again span{font-size:14px;color:#DCE7FD}
.again:disabled{opacity:.5;cursor:default}

/* simulacro */
.simgrid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.simgrid{grid-template-columns:minmax(0,1fr) 440px}}
.timer{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;background:var(--dark);color:#fff;font-family:var(--head);font-size:22px;font-weight:700}
.timer.low{background:var(--ko)}
.sheet{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.sheet button{position:relative;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:15px;color:var(--ink2)}
.sheet button.done{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.sheet button.cur{border:3px solid var(--blue);color:var(--blue);font-weight:700;background:var(--card)}
.sheet button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sheet button.ko{background:var(--ko);border-color:var(--ko);color:#fff}
.sheet button .f{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:7px;background:#F59E0B;border:2px solid var(--card)}

/* progreso */
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:900px){.levels{grid-template-columns:repeat(6,minmax(0,1fr))}}
.lv{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:14px}
.lv b{font-family:var(--head);font-size:30px}
.lv .h{font-size:13px;font-weight:700}
.lv span{font-size:13px}
.lv0{background:var(--bg);border:1px dashed var(--line);color:var(--ink2)}
.lv1{background:var(--kot);color:var(--kod)} .lv2{background:var(--amt);color:var(--amd)} .lv3{background:var(--bluet);color:var(--blued)} .lv4{background:var(--bluet);color:var(--blued);box-shadow:inset 0 0 0 2px var(--blue)} .lv5{background:var(--okt);color:var(--okd)}
.rules{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.rules{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rules div{padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.4}
.two-col{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (hover:none){.kbd{display:none}}
@media (min-width:960px){.two-col{grid-template-columns:minmax(0,1fr) 420px}}
.simrow{display:grid;grid-template-columns:80px 64px minmax(0,1fr) 92px;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2);font-size:15px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px 6px;border-top:1px solid var(--line2);text-align:left;vertical-align:middle}
.tbl th{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-top:none}
textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:13px;font-family:ui-monospace,Menlo,monospace}

/* chuleta */
.cifras{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.cifras{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cf{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;align-items:center;gap:10px;min-height:42px;padding:4px 0;border-top:1px solid var(--line2);font-size:14px;line-height:1.35}
.cf b{font-family:var(--head);font-size:18px}
.cf .pg{color:var(--mute);text-align:right}

/* estudiar: tarjeta de inicio, tema y apuntes (pensado primero para el móvil en vertical) */
.study{display:flex;flex-direction:column;gap:12px;border:2px solid var(--blue)}
.study .label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.study h2{font-size:22px;line-height:1.25}
.study .meta{font-size:14px;color:var(--ink2)}
.study .btns{display:flex;gap:10px;flex-wrap:wrap}
.study .btns .btn{flex:1 1 140px}
.gate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;line-height:1.45;color:var(--darkmute)}
.gate button{min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--darkline);background:transparent;color:var(--darkink2);font-size:13px;font-weight:600}
.secrow{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line2);align-items:start}
.secrow:first-child{border-top:none}
.secrow .num{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:var(--chip);color:var(--ink2)}
.secrow .num.done{background:var(--ok);color:#fff}
.secrow .num.next{background:var(--blue);color:#fff}
.secrow b{display:block;font-size:16px;line-height:1.3}
.secrow .meta{font-size:13px;color:var(--ink2);margin-top:3px}
.secrow .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.secrow .btns .btn{min-height:42px;font-size:15px;padding:0 14px}
.lesson{max-width:720px;margin:0 auto}
.ltop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ltop .where{flex:1 1 auto;min-width:0;font-size:13px;color:var(--ink2);line-height:1.35}
.ltop .where b{color:var(--ink);font-weight:600}
.secbar{display:flex;gap:4px;margin-top:6px}
.secbar i{flex:1;height:5px;border-radius:3px;background:var(--track)}
.secbar i.done{background:var(--ok)} .secbar i.cur{background:var(--blue)}

// Une dos progresos (p. ej., dos pestañas abiertas). Por pregunta gana la respuesta más reciente.
function mergeStates(a, b) {
  var r = JSON.parse(JSON.stringify(b));

/* =====================================================================
   Motor de repaso por rondas
   ===================================================================== */

function topicMastery(t) {

var view = "home", ses = null, simTimer = null, simRes = null, toastTimer = null;
var curTopic = null, curSec = null, lessonFrom = "home";
var app = document.getElementById("app");

}
function go(v) { view = v; render(); window.scrollTo(0, 0); }

/* ---------- Rondas ---------- */
function startRound(o) {

  if (!ids.length) {
    toast(o.mode === "fallos" ? "Todavía no has fallado ninguna pregunta." : (o.ids || o.sec || S().settings.all) ? "No hay preguntas para esa ronda." : "Aún no hay preguntas: estudia primero alguna sección de los apuntes.");
    return;
  }
  ses = { kind: "round", o: o, queue: ids.map(function (id) { return { id: id, rep: false }; }), i: 0,
          first: 0, good: 0, bad: 0, streak: 0, best: 0, ups: 0, news: 0, failed: [], reins: {},
          before: masteryMap(), counted: false, t0: Date.now() };
  prep(); go("q");
}
function survivalPool() { return MCQ.filter(available); }
function startSurvival() {
  if (!survivalPool().length) { toast("Primero estudia alguna sección: Supervivencia solo usa lo que has estudiado."); return; }

  ses.queue.push({ id: pickSurvival(), rep: false });

  var w = c.map(function (q) { return (!seen(q.id) || due(q.id) || lvl(q.id) <= 2) ? 3 : 1; });
  var tot = w.reduce(function (a, b) { return a + b; }, 0), x = Math.random() * tot;

/* ---------- Estudiar: apuntes por secciones ---------- */
function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
function pdfLink(p) { return '<a class="pg" href="' + PDF_URL + "#page=" + p + '" target="_blank" rel="noopener">p. ' + p + "</a>"; }
function textOf(x) {
  if (typeof x === "string") return x;
  if (Array.isArray(x)) return x.map(textOf).join(" ");
  if (x && typeof x === "object") return Object.keys(x).filter(function (k) { return k !== "img" && k !== "pg"; }).map(function (k) { return textOf(x[k]); }).join(" ");
  return "";
}
function readMins(sec) { return Math.max(1, Math.round(textOf(sec.blocks).split(/\s+/).length / 130)); } // lectura de estudio: ~130 palabras/min
function secPages(sec) { return sec.pages[0] === sec.pages[1] ? "p. " + sec.pages[0] : "p. " + sec.pages[0] + "–" + sec.pages[1]; }
function nq(n) { return n + plural(n, " pregunta", " preguntas"); }
function renderBlocks(sec) {
  var page = sec.pages[0], marked = {}, out = "";
  sec.blocks.forEach(function (b) {
    var pg = b.pg || page; page = pg;
    var anchor = marked[pg] ? "" : ' id="ap-p' + pg + '"';
    if (b.h != null) { out += "<h3" + anchor + "><span>" + fmt(b.h) + "</span>" + pdfLink(pg) + "</h3>"; marked[pg] = 1; return; }
    if (!marked[pg]) { out += '<div class="pgm"' + anchor + ">" + pdfLink(pg) + "</div>"; marked[pg] = 1; }
    if (b.p != null) out += "<p>" + fmt(b.p) + "</p>";
    else if (b.ul || b.ol) { var tag = b.ul ? "ul" : "ol"; out += "<" + tag + ">" + (b.ul || b.ol).map(function (x) { return "<li>" + fmt(x) + "</li>"; }).join("") + "</" + tag + ">"; }
    else if (b.def != null) out += '<dl class="def"><dt>' + fmt(b.def) + "</dt><dd>" + fmt(b.d) + "</dd></dl>";
    else if (b.kv) out += '<dl class="kv">' + b.kv.map(function (r) { return "<div><dt>" + fmt(r[0]) + "</dt><dd>" + fmt(r[1]) + "</dd></div>"; }).join("") + "</dl>";
    else if (b.tl) out += '<ol class="tl">' + b.tl.map(function (r) { return '<li><b class="t">' + fmt(r[0]) + "</b>" + fmt(r[1]) + "</li>"; }).join("") + "</ol>";
    else if (b.ojo != null) out += '<div class="box ojo"><span class="ic">Ojo</span><div>' + fmt(b.ojo) + "</div></div>";
    else if (b.tip != null) out += '<div class="box tip"><span class="ic">Truco</span><div>' + fmt(b.tip) + "</div></div>";
    else if (b.nov != null) out += '<div class="box novb"><span class="ic">Novedad</span><div>' + fmt(b.nov) + "</div></div>";
    else if (b.img) out += '<figure><a href="' + esc(b.img) + '" target="_blank" rel="noopener"><img src="' + esc(b.img) + '" alt="' + esc(b.alt || "") + '" loading="lazy"></a><figcaption>Toca la imagen para verla en grande · temario p. ' + pg + "</figcaption></figure>";
    else if (b.cards) out += '<div class="cards">' + b.cards.map(function (c) {
      return "<section><h4>" + fmt(c.t) + "</h4><dl>" + c.rows.map(function (r) { return "<dt>" + fmt(r[0]) + "</dt><dd>" + fmt(r[1]) + "</dd>"; }).join("") + "</dl></section>";
    }).join("") + "</div>";
  });
  return out;
}

      var done = secRead(s.id), n = SECQ[s.id].length, sv = SECQ[s.id].filter(function (q) { return seen(q.id); }).length;
      return '<div class="secrow"><span class="num' + (done ? " done" : nx && nx.id === s.id ? " next" : "") + '">' + (done ? "✓" : s.n) + "</span><div><b>" + esc(s.title) + '</b><div class="meta">' + secPages(s) + " · ≈ " + readMins(s) + " min · " + nq(n) + (sv ? " · dominio " + secMastery(s.id) + " %" : "") + "</div>" +
        '<div class="btns"><button class="btn' + (done ? "" : " primary") + '" data-a="read" data-v="' + s.id + '">' + (done ? "Releer" : "Leer") + "</button>" + (n ? '<button class="btn" data-a="check" data-v="' + s.id + '">Comprobar</button>' : "") + "</div></div></div>";
    }).join("") + "</section>";
  } else {
    var marked = !!S().study[topicKey(t.id)];
    body = '<section class="card stack" style="gap:12px"><b>Los apuntes de este tema aún no están en la app.</b><p class="muted">Mientras tanto, estúdialo en el PDF oficial (p. ' + esc(t.pages) + ") y márcalo como estudiado para que sus preguntas empiecen a salir en tus rondas.</p>" +
      '<div class="row wrap"><a class="btn" href="' + PDF_URL + "#page=" + firstPage(t.id) + '" target="_blank" rel="noopener">' + ICON.doc + "Abrir el PDF en la p. " + firstPage(t.id) + "</a>" +
      (marked ? '<span style="color:var(--ok);font-weight:600">✓ Marcado como estudiado</span>' : '<button class="btn primary" data-a="markTopic" data-v="' + t.id + '">Ya lo he estudiado</button>') + "</div></section>";
  }
  var roundBtn = '<button class="again" data-a="topicRound" data-v="' + t.id + '"' + (avail ? "" : " disabled") + "><span><b>Ronda de este tema</b><span>" + (avail ? avail + " de " + qs.length + " preguntas disponibles" : hasNotes(t.id) ? "Estudia una sección para desbloquear sus preguntas" : "Márcalo como estudiado para desbloquear sus preguntas") + "</span></span>" + ICON.arrow + "</button>";
  return '<header class="qtop">' + backBtn() + '<div class="grow"><h1 style="font-size:22px;line-height:1.25">' + esc(t.name) + (t.nov ? ' <span class="nov">NOVEDAD</span>' : "") + '</h1><p class="small muted" style="margin-top:4px">Tema ' + t.id + " · p. " + esc(t.pages) + " · " + seenN + " de " + qs.length + " preguntas vistas · dominio " + pm + " %</p></div></header>" +
    '<div class="stack" style="max-width:760px;margin:0 auto">' + body + roundBtn + "</div>";
}
function vLesson() {
  var sec = SECMAP[curSec], t = TMAP[sec.t], list = window.AP.byTopic[sec.t];
  var qn = (SECQ[sec.id] || []).length, nxt = secAfter(sec.id);
  var backLbl = lessonFrom === "q" ? "Pregunta" : lessonFrom === "simres" ? "Resultado" : lessonFrom === "home" ? "Inicio" : "Tema " + sec.t;
  var bars = '<div class="secbar">' + list.map(function (s) { return '<i class="' + (s.id === sec.id ? "cur" : secRead(s.id) ? "done" : "") + '"></i>'; }).join("") + "</div>";
  var head = '<header class="ltop">' + backBtn(backLbl, "lessonBack") + '<div class="where"><b>Tema ' + sec.t + " · " + esc(t.name) + "</b><br>Sección " + sec.n + " de " + sec.of + bars + "</div></header>";
  var meta = "≈ " + readMins(sec) + " min · " + secPages(sec) + " del temario · " + nq(qn) + (secRead(sec.id) ? ' · <span style="color:var(--ok);font-weight:600">✓ estudiada</span>' : "");
  var end;
  var fromQ = lessonFrom === "q" || lessonFrom === "simres";
  if (fromQ) end = '<button class="btn primary fab" data-a="lessonBack">' + ICON.back + (lessonFrom === "q" ? "Volver a la pregunta" : "Volver al resultado") + "</button>";
  else end = '<div class="lend">' + (qn ? '<button class="btn primary big" data-a="check" data-v="' + sec.id + '">Comprobar esta sección · ' + nq(qn) + "</button>" : "") +
    (nxt ? '<button class="btn big" data-a="nextSec" data-v="' + sec.id + '">Siguiente' + (nxt.t !== sec.t ? " (tema " + nxt.t + ")" : "") + ": " + esc(nxt.title) + "</button>" : '<button class="btn big" data-a="nextSec" data-v="' + sec.id + '">Terminar el tema</button>') +
    "<p>Al comprobar o pasar a la siguiente, esta sección queda como estudiada y sus preguntas empiezan a salir en tus rondas.</p></div>";
  return '<div class="lesson' + (fromQ ? " has-fab" : "") + '">' + head + '<article class="ap"><h1>' + esc(sec.title) + '</h1><p class="lmeta">' + meta + "</p>" + renderBlocks(sec) + "</article>" + end + "</div>";
}
function endNext() {
  if (!ses.o.sec) return "";
  var n = secAfter(ses.o.sec);
  if (!n) return '<button class="again" data-a="topic" data-v="' + SECMAP[ses.o.sec].t + '"><span><b>Volver al tema</b><span>Has llegado al final de los apuntes que hay</span></span>' + ICON.arrow + "</button>";
  return '<button class="again" data-a="read" data-v="' + n.id + '"><span><b>Siguiente: ' + esc(n.title) + "</b><span>Tema " + n.t + " · sección " + n.n + " de " + n.of + " · ≈ " + readMins(n) + " min de lectura</span></span>" + ICON.arrow + "</button>";
}

/* =====================================================================
   Acciones
   ===================================================================== */
var A = {
  home: function () { if (ses && ses.kind !== "sim") quit(); else { ses = null; go("home"); } },
  quit: quit,
  progress: function () { go("progress"); },
  cifras: function () { go("cifras"); },
  mode: function (v) { S().settings.mode = v; Store.save(); render(); },
  len: function (v) { S().settings.len = Number(v); Store.save(); render(); },
  start: function () { startRound({ mode: S().settings.mode, len: S().settings.len }); },
  topic: function (v) { curTopic = Number(v); go("topic"); },
  topicRound: function (v) { startRound({ mode: "tema", topic: Number(v), len: S().settings.len }); },
  read: function (v) { openLesson(v, view === "home" ? "home" : "topic"); },
  nextSec: function (v) { markRead(v); var n = secAfter(v); if (n) openLesson(n.id, "topic"); else { curTopic = SECMAP[v].t; go("topic"); } },
  check: function (v) { markRead(v); curTopic = SECMAP[v].t; startRound({ mode: "sec", sec: v, len: Math.min(20, (SECQ[v] || []).length) }); },
  markTopic: function (v) { markRead(topicKey(Number(v))); toast("Tema marcado como estudiado: sus preguntas ya pueden salir en tus rondas."); render(); },
  theory: function (v) {
    var q = QMAP[v], sid = SEC_OF[v]; if (!q || !sid) return;
    var s = SECMAP[sid], pg = pagesOf(q).filter(function (p) { return p >= s.pages[0] && p <= s.pages[1]; })[0];
    openLesson(sid, view === "simres" ? "simres" : "q", pg);
  },
  lessonBack: function () {
    if (lessonFrom === "q" && ses) go("q");
    else if (lessonFrom === "simres" && simRes) go("simres");
    else if (lessonFrom === "home") go("home");
    else { curTopic = SECMAP[curSec] ? SECMAP[curSec].t : curTopic; go("topic"); }
  },
  toggleAll: function () { S().settings.all = !S().settings.all; Store.save(); render(); },
  weak: function () { startRound({ mode: "fallos", len: S().settings.len }); },
  facts: function (v) { var c = CIFRAS[Number(v)]; startRound({ mode: "cifras", facts: c.facts, len: 12 }); },
  survival: startSurvival,
  sim: function () { if (confirm("¿Empezar un simulacro de 40 preguntas y 40 minutos? Como el examen real, incluye todo el temario, también lo que aún no has estudiado. Si sales antes de entregar, no se guarda.")) startSim(); },
  pick: function (v) { if (ses.phase !== "ask") return; ses.pick = Number(v); evaluate(ses.pick === 0); },
  tf: function (v) { if (ses.phase !== "ask") return; ses.pick = v === "true"; evaluate(ses.pick === QMAP[cur().id].a); },
  place: function (v) { ses.placed.push(Number(v)); render(); },
  unplace: function (v) { ses.placed.splice(Number(v), 1); render(); },
  checkOrder: function () { evaluate(ses.placed.every(function (x, i) { return x === i; })); },
  match: function (v) { var k = ses.placed.indexOf(null); if (k >= 0) { ses.placed[k] = Number(v); render(); } },
  unmatch: function (v) { ses.placed[Number(v)] = null; render(); },
  checkMatch: function () { evaluate(ses.placed.every(function (x, i) { return x === i; })); },
  sure: function () { confidence("sure"); },
  doubt: function () { confidence("doubt"); },
  next: next,
  again: function () { startRound(ses.o); },
  fixFailed: function () { var f = ses.failed.filter(function (v, i, a) { return a.indexOf(v) === i; }); startRound({ mode: "ids", ids: f, len: f.length }); },
  onlyNew: function () { startRound({ mode: "nuevas", len: S().settings.len }); },
  simPick: function (v) { ses.ans[ses.i] = Number(v); render(); },
  simGo: function (v) { ses.i = Number(v); render(); },
  simPrev: function () { if (ses.i > 0) { ses.i--; render(); } },
  simNext: function () { if (ses.i < SIM_N - 1) { ses.i++; render(); } },
  simFlag: function () { ses.flags[ses.i] = !ses.flags[ses.i]; render(); },
  simSubmit: function () {
    var left = ses.ans.filter(function (x) { return x == null; }).length;
    if (confirm(left ? "Te quedan " + left + " sin responder. ¿Entregar igualmente?" : "¿Entregar el simulacro?")) submitSim(false);
  },
  simQuit: function () { if (confirm("¿Salir del simulacro? No se guardará.")) { clearInterval(simTimer); ses = null; go("home"); } },
  simFix: function () { var ids = simRes.wrong.map(function (i) { return simRes.ids[i]; }); startRound({ mode: "ids", ids: ids, len: ids.length }); },
  download: downloadBackup,
  copy: copyBackup,
  paste: function () { var t = document.getElementById("codebox"); if (t && t.value.trim()) importText(t.value.trim()); else toast("Pega primero el texto de una copia."); },
  impAppend: function () { runImport("append"); },
  impReplace: function () { runImport("replace"); },
  impCancel: closeImportDialog,
  snap: function (v) { restoreSnapshot(Number(v)); },
  hideInstall: function () { S().ui.hideInstall = true; Store.save(); render(); }
};

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-a]");
  if (!el || el.tagName === "INPUT" || el.disabled) return;
  var fn = A[el.getAttribute("data-a")];
  if (fn) { e.preventDefault(); fn(el.getAttribute("data-v")); }
});
document.addEventListener("change", function (e) {
  var el = e.target;
  if (el.getAttribute && el.getAttribute("data-a") === "file" && el.files && el.files[0]) {
    var fr = new FileReader();
    fr.onload = function () { importText(String(fr.result)); };
    fr.readAsText(el.files[0]);
    el.value = "";
  }
});
document.addEventListener("keydown", function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA/.test((e.target && e.target.tagName) || "")) return;
  var k = e.key.toLowerCase();
  if (view === "q" && ses) {
    var q = QMAP[cur().id];
    if (ses.phase === "ask" && q.type === "mc" && /^[1-4a-d]$/.test(k)) { var idx = /\d/.test(k) ? Number(k) - 1 : "abcd".indexOf(k); A.pick(String(ses.ord[idx])); e.preventDefault(); }
    else if (ses.phase === "ask" && q.type === "tf" && (k === "v" || k === "f")) { A.tf(k === "v" ? "true" : "false"); e.preventDefault(); }
    else if (ses.phase === "conf" && (k === "1" || k === "2")) { k === "1" ? A.sure() : A.doubt(); e.preventDefault(); }
    else if ((ses.phase === "right" || ses.phase === "wrong") && (k === "enter" || k === " ")) { next(); e.preventDefault(); }
  } else if (view === "sim" && ses) {
    if (/^[1-4a-d]$/.test(k)) { var j = /\d/.test(k) ? Number(k) - 1 : "abcd".indexOf(k); A.simPick(String(ses.ords[ses.i][j])); e.preventDefault(); }
    else if (k === "arrowright") A.simNext(); else if (k === "arrowleft") A.simPrev();
  }
});
// Otra pestaña ha guardado: se une su progreso con el de esta (nunca se descarta ninguno).
window.addEventListener("storage", function (e) {
  if (e.key !== KEY || !e.newValue || !Store.state) return;
  try {
    var other = JSON.parse(e.newValue);
    if (!validState(other)) return;
    if (other.schema > SCHEMA) { Store.readOnly = true; render(); return; }
    Store.state = mergeStates(Store.state, normalize(other));
    Store.lastSeen = other.updatedAt;
    if (view === "home" || view === "progress") render();
  } catch (err) {}
});
// Aviso antes de cerrar con un simulacro a medias.
window.addEventListener("beforeunload", function (e) { if (ses && ses.kind === "sim") { e.preventDefault(); e.returnValue = ""; } });

Store.init().then(function () { render(); }).catch(function (err) {
  app.innerHTML = '<div class="banner red"><span class="grow">No se pudo cargar el progreso: ' + esc(err && err.message) + ". No toques nada y recarga la página.</span></div>";
});

window.__dronExam = { Store: Store, buildRound: buildRound, buildSim: buildSim, version: APP_VERSION, secOf: SEC_OF, secQ: SECQ, mergeStates: mergeStates };
})();
</script>
</body>
</html>
